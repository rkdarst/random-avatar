<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Avatar Icon Generator</title>
<style>
  :root {
    --bg: #1e1e2e;
    --fg: #e6e6e6;
    --accent: #7c6ff0;
    --panel: #2a2a3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 1rem;
  }
  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    margin: 0;
  }
  #preview {
    width: 256px;
    height: 256px;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
    display: block;
    /* Checkerboard shows through where the silhouette mask is transparent. */
    background: repeating-conic-gradient(#3f3f5a 0% 25%, #33334c 0% 50%) 0 0 / 16px 16px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    background: var(--panel);
    padding: 0.75rem 1rem;
    border-radius: 12px;
  }
  .controls label {
    font-size: 0.9rem;
  }
  input[type="number"] {
    width: 5.5rem;
    padding: 0.4rem 0.5rem;
    border-radius: 8px;
    border: 1px solid #44445c;
    background: var(--bg);
    color: var(--fg);
    font-size: 0.95rem;
  }
  button {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #letterInput {
    width: 3rem;
    padding: 0.4rem 0.5rem;
    border-radius: 8px;
    border: 1px solid #44445c;
    background: var(--bg);
    color: var(--fg);
    font-size: 0.95rem;
    text-align: center;
    text-transform: uppercase;
  }
  button:hover { filter: brightness(1.15); }
  select {
    padding: 0.45rem 0.5rem;
    border-radius: 8px;
    border: 1px solid #44445c;
    background: var(--bg);
    color: var(--fg);
    font-size: 0.95rem;
  }
  #seedLink {
    font-size: 0.8rem;
    color: #9a9ab5;
    max-width: 32rem;
    text-align: center;
    word-break: break-all;
    margin: 0;
  }
  #seedLink a { color: var(--accent); }
  .tagline {
    font-size: 0.8rem;
    color: #9a9ab5;
    max-width: 32rem;
    text-align: center;
    line-height: 1.45;
    margin: -0.5rem 0 0;
  }
  .history {
    width: 100%;
    max-width: 34rem;
    background: var(--panel);
    border-radius: 12px;
    padding: 0.75rem 1rem 1rem;
  }
  .history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.6rem;
  }
  .history h2 { font-size: 1rem; font-weight: 600; margin: 0; color: #9a9ab5; }
  button.secondary {
    background: #4a4a68;
    font-size: 0.8rem;
    padding: 0.3rem 0.7rem;
  }
  #historyGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 0.5rem;
  }
  #historyGrid canvas {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    background: repeating-conic-gradient(#3f3f5a 0% 25%, #33334c 0% 50%) 0 0 / 8px 8px;
    border: 2px solid transparent;
    cursor: pointer;
    display: block;
  }
  #historyGrid canvas:hover { border-color: var(--accent); }
  #historyGrid canvas.active { border-color: #6bd968; }
  .history .hint { color: #6a6a88; font-size: 0.85rem; margin: 0.25rem 0 0; }
</style>
</head>
<body>
  <h1>Random Avatar Icon</h1>
  <p class="tagline">Outputs are machine generated and thus CC-0.  Each individual generation is simple algorithms does not run an "AI" algorithm, though code is LLM generated.</p>
  <canvas id="preview" width="256" height="256" aria-label="Random gradient avatar preview"></canvas>
  <div class="controls">
    <label for="familySelect">Pattern:</label>
    <select id="familySelect">
      <option value="random" selected>Random</option>
      <option value="plain">Plain</option>
      <option value="shapes">Shapes</option>
      <option value="rings">Rings</option>
      <option value="stripes">Stripes</option>
      <option value="pixels">Pixels</option>
      <option value="mirror">Mirror</option>
      <option value="waves">Waves</option>
      <option value="rays">Rays</option>
      <option value="blocks">Blocks</option>
      <option value="dots">Dots</option>
      <option value="checker">Checker</option>
      <option value="spiral">Spiral</option>
      <option value="blobs">Blobs</option>
    </select>
    <label for="tempSelect" title="Color temperament; Random mixes the classic looks with occasional new ones (neon, jewel, earth, ocean, mono)">Palette:</label>
    <select id="tempSelect">
      <option value="random" selected>Random</option>
      <option value="vivid">Vivid</option>
      <option value="pastel">Pastel</option>
      <option value="muted">Muted</option>
      <option value="dark">Dark</option>
      <option value="clash">Clash</option>
      <option value="neon">Neon</option>
      <option value="jewel">Jewel</option>
      <option value="earth">Earth</option>
      <option value="ocean">Ocean</option>
      <option value="mono">Mono</option>
    </select>
    <label for="shapeSelect" title="Silhouette mask; Random picks one from the seed (everything outside the shape is transparent)">Shape:</label>
    <select id="shapeSelect">
      <option value="random" selected>Random</option>
      <option value="none">Square</option>
      <option value="circle">Circle</option>
      <option value="rounded">Rounded</option>
      <option value="hexagon">Hexagon</option>
      <option value="shield">Shield</option>
      <option value="diamond">Diamond</option>
      <option value="star">Star</option>
      <option value="blob">Blob</option>
      <option value="pill">Pill</option>
    </select>
    <label for="sizeInput">Download size (px):</label>
    <input type="number" id="sizeInput" min="16" max="1024" step="1" value="256">
    <label for="letterInput" title="Optional single character drawn on top (any character)">Letter:</label>
    <input type="text" id="letterInput" maxlength="2" autocomplete="off" spellcheck="false">
    <button id="regenBtn" type="button">Regenerate</button>
    <button id="downloadBtn" type="button">Download PNG</button>
  </div>
  <p id="seedLink"></p>
  <div class="history">
    <div class="history-head">
      <h2>History</h2>
      <button id="clearHistoryBtn" type="button" class="secondary">Clear</button>
    </div>
    <div id="historyGrid"></div>
    <p id="historyEmpty" class="hint">Avatars you generate will appear here &mdash; click one to bring it back.</p>
  </div>

<script>
(function () {
  'use strict';

  var PREVIEW_SIZE = 256;
  var MIN_SIZE = 16;
  var MAX_SIZE = 1024;
  var FAMILY_NAMES = ['plain', 'shapes', 'rings', 'stripes', 'pixels', 'mirror',
                      'waves', 'rays', 'blocks', 'dots', 'checker', 'spiral', 'blobs'];

  // Temperaments set the sat/lightness character plus an optional hue rule
  // (a gap override or an arc the two hues are locked into). Seed bits
  // 19-22 pick one with no RNG: buckets 0-7 are the classic mapping (so
  // seeds with bit 22 clear are unchanged), 8-15 the extended looks,
  // weighted so vivid stays the common case. The bands only rescale
  // existing rand() draws, so the RNG stream and pattern geometry are
  // untouched.
  var TEMPERAMENT_NAMES = ['vivid', 'pastel', 'muted', 'dark', 'clash',
                           'neon', 'jewel', 'earth', 'ocean', 'mono'];
  var TEMPERAMENTS = [
    { sat: 60, satSpan: 30, lig: 40, ligSpan: 30, patLig: 35, patLigSpan: 40 },  // vivid
    { sat: 30, satSpan: 25, lig: 72, ligSpan: 14, patLig: 62, patLigSpan: 26 },  // pastel
    { sat: 12, satSpan: 26, lig: 42, ligSpan: 22, patLig: 36, patLigSpan: 34 },  // muted
    { sat: 45, satSpan: 35, lig: 16, ligSpan: 16, patLig: 34, patLigSpan: 28 },  // dark
    { sat: 75, satSpan: 20, lig: 38, ligSpan: 34, patLig: 30, patLigSpan: 50,   // clash
      gap: [65, 45] },                                                          // dissonant gap
    { sat: 88, satSpan: 12, lig: 45, ligSpan: 23, patLig: 40, patLigSpan: 38 },  // neon
    { sat: 80, satSpan: 20, lig: 24, ligSpan: 18, patLig: 44, patLigSpan: 34 },  // jewel
    { sat: 25, satSpan: 30, lig: 32, ligSpan: 28, patLig: 44, patLigSpan: 22,   // earth
      arc: [12, 46] },                                                          // warm hues
    { sat: 40, satSpan: 35, lig: 35, ligSpan: 30, patLig: 40, patLigSpan: 25,   // ocean
      arc: [165, 80] },                                                         // cool hues
    { sat: 28, satSpan: 30, lig: 35, ligSpan: 33, patLig: 30, patLigSpan: 55,   // mono
      gap: [0, 12] }                                                            // ~single hue
  ];
  function temperamentFromSeed(seed, forcedT) {
    if (forcedT !== null && forcedT !== undefined) return forcedT;
    var b = (seed >>> 19) & 15;
    if (b < 4) return 0;
    if (b < 8) return b - 3;
    return [5, 6, 7, 8, 9, 5, 7, 0][b - 8];
  }

  // Silhouette masks cut around every avatar after all layers are drawn
  // (everything outside the shape becomes transparent). Seed bits 23-26
  // pick one of the eight shapes with zero RNG, so pattern geometry and
  // colors never shift, and bits 27-30 add a small rotation to the
  // polygon-like ones. The Shape selector can force any entry; "none"
  // (the full square) only comes from forcing. Append-only, like
  // FAMILY_NAMES and TEMPERAMENT_NAMES.
  var SHAPE_NAMES = ['none', 'circle', 'rounded', 'hexagon', 'shield',
                     'diamond', 'star', 'blob', 'pill'];
  function shapeFromSeed(seed, forcedS) {
    if (forcedS !== null && forcedS !== undefined) return forcedS;
    return 1 + ((seed >>> 23) & 7);
  }

  var preview = document.getElementById('preview');
  var familySelect = document.getElementById('familySelect');
  var tempSelect = document.getElementById('tempSelect');
  var shapeSelect = document.getElementById('shapeSelect');
  var sizeInput = document.getElementById('sizeInput');
  var letterInput = document.getElementById('letterInput');
  var regenBtn = document.getElementById('regenBtn');
  var downloadBtn = document.getElementById('downloadBtn');
  var seedLink = document.getElementById('seedLink');
  var historyGrid = document.getElementById('historyGrid');
  var historyEmpty = document.getElementById('historyEmpty');
  var clearHistoryBtn = document.getElementById('clearHistoryBtn');

  // --- Seeded RNG (mulberry32) so avatars are reproducible via URL hash ---
  function mulberry32(seed) {
    return function () {
      seed |= 0;
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function randomSeed() {
    var buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    return buf[0];
  }

  // Hash format: seed[.family][.letter][.temperament][.shape]. Family is
  // 0-FAMILY_NAMES.length-1 (one or two digits), temperament and shape are
  // single digits 0-TEMPERAMENT_NAMES.length-1 / 0-SHAPE_NAMES.length-1.
  // The letter is any single character:
  // alphanumerics are stored lowercased (as in old links), everything else
  // URL-encoded ("." itself is stored as %2E so it cannot clash with the
  // separators). "seed..c" means a letter with a random family. Returns
  // null if invalid.
  function decodeLetterPart(part) {
    var s;
    try { s = decodeURIComponent(part); } catch (e) { return null; }
    var c = Array.from(s)[0];
    return (c !== undefined && c.trim() !== '') ? c : null;
  }

  function parseHashStr(str) {
    var parts = (str || '').replace(/^#/, '').split('.');
    if (parts.length > 5 || !/^[0-9a-fA-F]{1,8}$/.test(parts[0])) return null;
    var res = { seed: parseInt(parts[0], 16) >>> 0, family: null, letter: '', temp: null, shape: null };
    if (parts.length > 1 && parts[1] !== '') {
      if (/^\d{1,2}$/.test(parts[1])) {
        var fam = parseInt(parts[1], 10);
        if (fam >= FAMILY_NAMES.length) return null;
        res.family = fam;
      } else {                       // non-numeric second part: an encoded letter
        var c1 = decodeLetterPart(parts[1]);
        if (c1 === null) return null;
        res.letter = c1;
      }
    }
    if (parts.length > 2 && parts[2] !== '') {
      var c2 = decodeLetterPart(parts[2]);
      if (c2 === null) return null;
      res.letter = c2;
    }
    if (parts.length > 3 && parts[3] !== '') {
      if (!/^\d{1,2}$/.test(parts[3])) return null;
      var t = parseInt(parts[3], 10);
      if (t >= TEMPERAMENT_NAMES.length) return null;
      res.temp = t;
    }
    if (parts.length > 4 && parts[4] !== '') {
      if (!/^\d{1,2}$/.test(parts[4])) return null;
      var sh = parseInt(parts[4], 10);
      if (sh >= SHAPE_NAMES.length) return null;
      res.shape = sh;
    }
    return res;
  }

  function seedFromHash() {
    return parseHashStr(location.hash);
  }

  // --- Drawing ---
  function drawAvatar(ctx, size, rand, forced, letter, seed, forcedT, forcedS) {
    // Two random anchor points on the square (linear gradient anchors).
    var x1 = rand() * size, y1 = rand() * size;
    var x2 = rand() * size, y2 = rand() * size;

    // Push the two anchors apart so gradients are rarely a flat blur.
    if (Math.abs(x2 - x1) + Math.abs(y2 - y1) < size * 0.4) {
      x2 = (x1 + size * 0.5) % size;
      y2 = (y1 + size * 0.5) % size;
    }

    // Two base hues form the palette for the whole avatar. Their relation
    // comes from seed bits (zero RNG), so some avatars are near-monochrome
    // and others colorful, but none becomes a rainbow. Exactly one rand()
    // is consumed for hueB (as jitter or full randomness, matching the old
    // random-hue draw), so pattern geometry of existing links never shifts.
    // The temperament (seed bits 19-22, or the Palette selector) rescales
    // the sat/lightness draws below and may replace the hue relation with
    // a fixed gap or a locked hue arc.
    var temp = temperamentFromSeed(seed, forcedT);
    var band = TEMPERAMENTS[temp];
    var hueA = rand() * 360;
    var satA = band.sat + rand() * band.satSpan, ligA = band.lig + rand() * band.ligSpan;
    var scheme = (seed >>> 17) & 3;
    var hueB;
    if (band.arc) {                                // hue-locked palettes
      hueA = band.arc[0] + hueA % band.arc[1];
      hueB = band.arc[0] + (hueA - band.arc[0] + 20 + rand() * 40) % band.arc[1];
    }
    else if (band.gap) hueB = hueA + band.gap[0] + rand() * band.gap[1];
    else if (scheme === 0) hueB = hueA + 20 + rand() * 25;   // analogous
    else if (scheme === 1) hueB = hueA + 150 + rand() * 30;  // split-complement
    else if (scheme === 2) hueB = hueA + 160 + rand() * 40;  // complementary
    else hueB = rand() * 360;                                // independent
    var satB = band.sat + rand() * band.satSpan, ligB = band.lig + rand() * band.ligSpan;

    // Format an hsl()/hsla() string (alpha given yields hsla with alpha).
    function fmt(h, s, l, alpha) {
      h = Math.floor(((h % 360) + 360) % 360);
      if (alpha === undefined) return 'hsl(' + h + ', ' + s + '%, ' + l + '%)';
      return 'hsla(' + h + ', ' + s + '%, ' + l + '%, ' + alpha + ')';
    }

    // Every later color is one of the two base hues with a small jitter and
    // a rare derived accent, so multi-element patterns stay coherent. Still
    // exactly three rand() draws per call (the first picks the base and its
    // fraction doubles as the jitter), keeping pattern geometry stable.
    function makeColor(alpha) {
      var p = rand();
      var hue = (p < 0.5 ? hueA : hueB) + (p % 0.5) * 60 - 15;  // +/-15 deg
      if (p > 0.94) hue = hueB + 40;             // occasional derived accent
      var sat = band.sat + rand() * band.satSpan;
      var lig = band.patLig + rand() * band.patLigSpan;  // pattern band
      return fmt(hue, sat.toFixed(1), lig.toFixed(1), alpha);
    }

    var grad = ctx.createLinearGradient(x1, y1, x2, y2);
    grad.addColorStop(0, fmt(hueA, satA.toFixed(1), ligA.toFixed(1)));
    grad.addColorStop(1, fmt(hueB, satB.toFixed(1), ligB.toFixed(1)));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);

    // The family roll happens AFTER all gradient draws, so existing shared
    // hashes keep rendering the same base gradient. Fixed draw order:
    // gradient first, then one family layer, then the optional letter.
    var family = Math.floor(rand() * FAMILY_NAMES.length);
    // A forced family (from the Pattern selector) replaces the rolled one,
    // but the roll is still consumed, so the base gradient of a seed never
    // changes when the user switches patterns.
    if (forced !== null && forced !== undefined) family = forced;
    if (family === 1) drawShapes(ctx, size, rand, makeColor);
    else if (family === 2) drawRings(ctx, size, rand, makeColor, x1, y1);
    else if (family === 3) drawStripes(ctx, size, rand, makeColor);
    else if (family === 4) drawPixels(ctx, size, rand, makeColor);
    else if (family === 5) drawMirror(ctx, size, rand, makeColor);
    else if (family === 6) drawWaves(ctx, size, rand, makeColor);
    else if (family === 7) drawRays(ctx, size, rand, makeColor, x1, y1);
    else if (family === 8) drawBlocks(ctx, size, rand, makeColor);
    else if (family === 9) drawDots(ctx, size, rand, makeColor);
    else if (family === 10) drawChecker(ctx, size, rand, makeColor);
    else if (family === 11) drawSpiral(ctx, size, rand, makeColor, x2, y2);
    else if (family === 12) drawBlobs(ctx, size, rand, makeColor);
    if (letter) drawLetter(ctx, size, rand, makeColor, letter);
    // The silhouette mask runs last so every layer, the letter included,
    // clips into the shape. The shape comes from seed bits (zero RNG), so
    // pattern geometry and colors are untouched; "none" keeps the square.
    var shape = shapeFromSeed(seed, forcedS);
    if (shape !== 0) {
      var rot = ((seed >>> 27) & 15) * (Math.PI / 64);   // 0 to ~42 degrees
      ctx.save();
      ctx.globalCompositeOperation = 'destination-in';
      ctx.fillStyle = '#fff';
      shapePath(ctx, size, shape, rot);
      ctx.fill();
      ctx.restore();
    }
    return family;
  }

  // 1-3 geometric accents (circle / square / triangle) on the gradient.
  function drawShapes(ctx, size, rand, makeColor) {
    var count = 1 + Math.floor(rand() * 3);
    for (var i = 0; i < count; i++) {
      var kind = Math.floor(rand() * 3);
      var d = size * (0.25 + rand() * 0.45);  // min 25% so shapes read at 16px
      var cx = rand() * size, cy = rand() * size;
      var angle = rand() * Math.PI * 2;
      ctx.save();
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = makeColor();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.beginPath();
      if (kind === 0) {
        ctx.arc(0, 0, d / 2, 0, Math.PI * 2);
      } else if (kind === 1) {
        ctx.rect(-d / 2, -d / 2, d, d);
      } else {
        ctx.moveTo(0, -d / 2);
        ctx.lineTo(d / 2, d / 2);
        ctx.lineTo(-d / 2, d / 2);
        ctx.closePath();
      }
      ctx.fill();
      ctx.restore();
    }
  }

  // 2-4 concentric rings centered on one of the gradient anchors.
  function drawRings(ctx, size, rand, makeColor, cx, cy) {
    var count = 2 + Math.floor(rand() * 3);
    var lineWidth = size * (0.06 + rand() * 0.08);
    if (lineWidth < size / 10) lineWidth = size / 10;  // visible at 16px
    ctx.lineWidth = lineWidth;
    for (var i = 0; i < count; i++) {
      ctx.strokeStyle = makeColor();
      ctx.beginPath();
      ctx.arc(cx, cy, (i + 1) * size * 0.22, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Diagonal semi-transparent bands at a random angle across the gradient.
  function drawStripes(ctx, size, rand, makeColor) {
    var bands = 3 + Math.floor(rand() * 5);    // 3-7 bands
    var angle = rand() * Math.PI;
    var color = makeColor();
    var span = size * 2;                       // covers the square when rotated
    var step = span / bands;
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = color;
    ctx.translate(size / 2, size / 2);
    ctx.rotate(angle);
    for (var i = 0; i < bands; i += 2) {
      ctx.fillRect(-span / 2 + i * step, -span / 2, step, span);
    }
    ctx.restore();
  }

  // Random-filled cells on a coarse grid: blocky, reads well even at 16px.
  function drawPixels(ctx, size, rand, makeColor) {
    var n = 4 + Math.floor(rand() * 5);          // 4-8 cells per row
    var cell = size / n;
    for (var y = 0; y < n; y++) {
      for (var x = 0; x < n; x++) {
        if (rand() < 0.45) continue;             // ~45% of cells stay clear
        ctx.save();
        ctx.globalAlpha = 0.5 + rand() * 0.3;
        ctx.fillStyle = makeColor();
        ctx.fillRect(x * cell, y * cell, cell, cell);
        ctx.restore();
      }
    }
  }

  // GitHub-style identicon: 5x5 cells mirrored left-right, sometimes also
  // top-bottom. Symmetry makes it read as a deliberate mark.
  function drawMirror(ctx, size, rand, makeColor) {
    var n = 5;
    var cell = size / n;
    var both = rand() < 0.5;                     // true: mirror top-bottom too
    ctx.save();
    ctx.globalAlpha = 0.7 + rand() * 0.25;
    ctx.fillStyle = makeColor();
    for (var y = 0; y < (both ? (n + 1) / 2 : n); y++) {
      for (var x = 0; x < (n + 1) / 2; x++) {
        if (rand() < 0.5) continue;              // ~50% of half-cells filled
        ctx.fillRect(x * cell, y * cell, cell, cell);
        ctx.fillRect((n - 1 - x) * cell, y * cell, cell, cell);
        if (both && y < Math.floor(n / 2)) {
          ctx.fillRect(x * cell, (n - 1 - y) * cell, cell, cell);
          ctx.fillRect((n - 1 - x) * cell, (n - 1 - y) * cell, cell, cell);
        }
      }
    }
    ctx.restore();
  }

  // 2-4 semi-transparent sinusoidal bands at a random angle across the square.
  function drawWaves(ctx, size, rand, makeColor) {
    var bands = 2 + Math.floor(rand() * 3);      // 2-4 wave lines
    var angle = rand() * Math.PI;
    var amp = size * (0.05 + rand() * 0.12);     // wave height
    var waves = 1 + rand() * 2;                  // 1-3 full waves across
    var phase = rand() * Math.PI * 2;
    var thick = size * (0.08 + rand() * 0.12);
    if (thick < size / 10) thick = size / 10;    // visible at 16px
    var span = size * 2;                         // covers the square when rotated
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = makeColor();
    ctx.lineWidth = thick;
    ctx.translate(size / 2, size / 2);
    ctx.rotate(angle);
    for (var i = 0; i < bands; i++) {
      var offset = (i - (bands - 1) / 2) * size * 0.28;
      ctx.beginPath();
      for (var t = 0; t <= 1.001; t += 0.02) {
        var px = -span / 2 + t * span;
        var py = offset + amp * Math.sin(phase + t * waves * Math.PI * 2);
        if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // Sunburst: alternating pie wedges radiating from one gradient anchor.
  function drawRays(ctx, size, rand, makeColor, cx, cy) {
    var wedges = 6 + Math.floor(rand() * 9);     // 6-14 wedges
    var start = rand() * Math.PI * 2;
    ctx.save();
    ctx.globalAlpha = 0.3 + rand() * 0.25;
    ctx.fillStyle = makeColor();
    var reach = size * 1.5;                      // reaches every corner
    for (var i = 0; i < wedges; i += 2) {
      var a0 = start + i * (Math.PI * 2 / wedges);
      var a1 = a0 + Math.PI * 2 / wedges;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, reach, a0, a1);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Mondrian: recursively split the square into 3-6 solid rectangles.
  function drawBlocks(ctx, size, rand, makeColor) {
    var splits = 2 + Math.floor(rand() * 4);     // 2-5 splits -> 3-6 rects
    var rects = [{ x: 0, y: 0, w: size, h: size }];
    for (var i = 0; i < splits; i++) {
      var r = rects.splice(Math.floor(rand() * rects.length), 1)[0];
      var frac = 0.3 + rand() * 0.4;             // avoid hairline slivers
      // Split direction is random, not longest-side: alternating cuts are
      // what make this read as Mondrian blocks instead of stripes.
      var horizontal = rand() < 0.5;
      if (horizontal) {
        rects.push({ x: r.x, y: r.y, w: r.w, h: r.h * frac },
                   { x: r.x, y: r.y + r.h * frac, w: r.w, h: r.h * (1 - frac) });
      } else {
        rects.push({ x: r.x, y: r.y, w: r.w * frac, h: r.h },
                   { x: r.x + r.w * frac, y: r.y, w: r.w * (1 - frac), h: r.h });
      }
    }
    ctx.save();
    ctx.globalAlpha = 0.45;
    var pad = size * 0.01;                       // seam shows the gradient
    for (var j = 0; j < rects.length; j++) {
      if (rand() < 0.25) continue;               // some rects stay clear
      ctx.fillStyle = makeColor();
      ctx.fillRect(rects[j].x + pad, rects[j].y + pad,
                   rects[j].w - 2 * pad, rects[j].h - 2 * pad);
    }
    ctx.restore();
  }

  // Scattered semi-transparent polka dots over the gradient.
  function drawDots(ctx, size, rand, makeColor) {
    var count = 6 + Math.floor(rand() * 9);      // 6-14 dots
    for (var i = 0; i < count; i++) {
      var r = size * (0.06 + rand() * 0.12);
      if (r < size / 10) r = size / 10;          // visible at 16px
      var cx = rand() * size, cy = rand() * size;
      ctx.save();
      ctx.globalAlpha = 0.45 + rand() * 0.25;
      ctx.fillStyle = makeColor();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // Rotated translucent checkerboard laid over the gradient.
  function drawChecker(ctx, size, rand, makeColor) {
    var cells = 3 + Math.floor(rand() * 4);      // 3-6 cells per row
    var angle = rand() * Math.PI / 2;
    var span = size * 2;                         // covers the square when rotated
    var step = span / (cells * 2);
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = makeColor();
    ctx.translate(size / 2, size / 2);
    ctx.rotate(angle);
    for (var y = 0; y < cells * 2; y++) {
      for (var x = 0; x < cells * 2; x++) {
        if ((x + y) % 2 === 0) continue;         // fill every other cell
        ctx.fillRect(-span / 2 + x * step, -span / 2 + y * step, step, step);
      }
    }
    ctx.restore();
  }

  // Archimedean spiral stroke centered on one of the gradient anchors.
  function drawSpiral(ctx, size, rand, makeColor, cx, cy) {
    var turns = 2 + rand() * 2;                  // 2-4 turns
    var lineWidth = size * (0.06 + rand() * 0.08);
    if (lineWidth < size / 12) lineWidth = size / 12;  // visible at 16px
    var reach = size * (0.7 + rand() * 0.5);
    var phase = rand() * Math.PI * 2;
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = makeColor();
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.beginPath();
    var steps = 200;
    for (var i = 0; i <= steps; i++) {
      var t = i / steps;
      var a = phase + t * turns * Math.PI * 2;
      var px = cx + t * reach * Math.cos(a);
      var py = cy + t * reach * Math.sin(a);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Soft radial-gradient blobs floating over the gradient.
  function drawBlobs(ctx, size, rand, makeColor) {
    var count = 3 + Math.floor(rand() * 4);      // 3-6 blobs
    for (var i = 0; i < count; i++) {
      var r = size * (0.18 + rand() * 0.25);
      var cx = rand() * size, cy = rand() * size;
      var blob = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      blob.addColorStop(0, makeColor(0.7));
      blob.addColorStop(1, makeColor(0));        // same hue fading out
      ctx.fillStyle = blob;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Builds the silhouette path for shape id on a full-size square canvas.
  // rot is the seed-derived rotation (radians) used by the polygon-like
  // shapes; every coordinate is proportional to size so downloads at any
  // resolution scale exactly. Consumes no rand() draws.
  function shapePath(ctx, size, id, rot) {
    var c = size / 2, r = size / 2;
    // Regular n-gon inscribed in the square; with inner set, a 2n-point
    // star alternating between the full and the 45% radius.
    function polygon(n, star) {
      var count = star ? n * 2 : n, step = Math.PI * 2 / count;
      for (var i = 0; i < count; i++) {
        var a = rot - Math.PI / 2 + i * step;
        var rr = (star && i % 2) ? r * 0.45 : r;
        var px = c + rr * Math.cos(a), py = c + rr * Math.sin(a);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }
    ctx.beginPath();
    if (id === 1) {                                 // circle
      ctx.arc(c, c, r, 0, Math.PI * 2);
    } else if (id === 2) {                          // squircle
      var k = size * 0.3;
      ctx.moveTo(k, 0);
      ctx.lineTo(size - k, 0); ctx.quadraticCurveTo(size, 0, size, k);
      ctx.lineTo(size, size - k); ctx.quadraticCurveTo(size, size, size - k, size);
      ctx.lineTo(k, size); ctx.quadraticCurveTo(0, size, 0, size - k);
      ctx.lineTo(0, k); ctx.quadraticCurveTo(0, 0, k, 0);
    } else if (id === 3) {                          // hexagon
      polygon(6);
    } else if (id === 4) {                          // shield (upright)
      var w = size * 0.86, l = (size - w) / 2;
      ctx.moveTo(l, size * 0.03);
      ctx.lineTo(size - l, size * 0.03);
      ctx.lineTo(size - l, size * 0.55);
      ctx.bezierCurveTo(size - l, size * 0.8, c + w * 0.18, size * 0.95, c, size);
      ctx.bezierCurveTo(c - w * 0.18, size * 0.95, l, size * 0.8, l, size * 0.55);
      ctx.closePath();
    } else if (id === 5) {                          // diamond
      polygon(4);
    } else if (id === 6) {                          // 5-point star
      polygon(5, true);
    } else if (id === 7) {                          // organic blob (fixed profile)
      var rad = [1, 0.78, 0.92, 0.72, 0.95, 0.82], pts = [];
      for (var i = 0; i < 6; i++) {
        var a = rot - Math.PI / 2 + i * Math.PI / 3;
        pts.push([c + r * rad[i] * Math.cos(a), c + r * rad[i] * Math.sin(a)]);
      }
      var sx = (pts[5][0] + pts[0][0]) / 2, sy = (pts[5][1] + pts[0][1]) / 2;
      ctx.moveTo(sx, sy);                           // smooth closed curve
      for (var j = 1; j <= 5; j++) {
        var nx = pts[(j + 1) % 6];
        ctx.quadraticCurveTo(pts[j][0], pts[j][1], (pts[j][0] + nx[0]) / 2, (pts[j][1] + nx[1]) / 2);
      }
      ctx.quadraticCurveTo(pts[0][0], pts[0][1], sx, sy);
      ctx.closePath();
    } else {                                        // pill (tall capsule)
      var w2 = size * 0.62;
      ctx.arc(c, w2 / 2, w2 / 2, Math.PI, Math.PI * 2);
      ctx.arc(c, size - w2 / 2, w2 / 2, 0, Math.PI);
      ctx.closePath();
    }
  }

  // Optional letter overlay, drawn last over everything else: one glyph at
  // a random spot with a random size, tilt, and color (plus a dark stroke
  // so it reads on any background). Consumes rand() only when a letter is
  // set, so toggling it never changes the base gradient or pattern.
  function drawLetter(ctx, size, rand, makeColor, letter) {
    var glyph = letter.toUpperCase();
    var fontSize = size * (0.5 + rand() * 0.25);
    var cx = size * (0.3 + rand() * 0.4);        // keeps the glyph inside
    var cy = size * (0.3 + rand() * 0.4);
    var angle = (rand() - 0.5) * Math.PI / 4.5;  // tilt within +/-20 degrees
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.font = 'bold ' + fontSize.toFixed(1) + 'px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = makeColor();
    ctx.lineWidth = Math.max(size / 24, fontSize * 0.06);
    ctx.strokeStyle = 'rgba(16, 16, 24, 0.55)';
    ctx.strokeText(glyph, 0, 0);
    ctx.fillText(glyph, 0, 0);
    ctx.restore();
  }

  // --- State ---
  var parsed = seedFromHash();
  var currentSeed = parsed ? parsed.seed : randomSeed();
  if (parsed && parsed.family !== null) familySelect.value = FAMILY_NAMES[parsed.family];
  if (parsed && parsed.temp !== null) tempSelect.value = TEMPERAMENT_NAMES[parsed.temp];
  if (parsed && parsed.shape !== null) shapeSelect.value = SHAPE_NAMES[parsed.shape];
  if (parsed) letterInput.value = parsed.letter.toUpperCase();

  function forcedFamily() {
    var v = familySelect.value;
    return v === 'random' ? null : FAMILY_NAMES.indexOf(v);
  }

  function forcedTemperament() {
    var v = tempSelect.value;
    return v === 'random' ? null : TEMPERAMENT_NAMES.indexOf(v);
  }

  function forcedShape() {
    var v = shapeSelect.value;
    return v === 'random' ? null : SHAPE_NAMES.indexOf(v);
  }

  function currentLetter() {
    // First character of the input; any character except whitespace counts.
    // Array.from splits per code point, so astral chars (emoji) count as one.
    var c = Array.from(letterInput.value)[0];
    return (c !== undefined && c.trim() !== '') ? c : '';
  }

  // Letters/digits stay lowercase in the hash (old-link compatible); any
  // other character is URL-encoded, and "." becomes "%2E" so it cannot be
  // mistaken for a part separator.
  function encodeLetter(c) {
    if (/[a-zA-Z0-9]/.test(c)) return c.toLowerCase();
    return encodeURIComponent(c).replace(/\./g, '%2E');
  }

  function hashFor(seed, forced, letter, temp, shape) {
    var parts = [(seed >>> 0).toString(16),
                 forced === null ? '' : String(forced),
                 letter ? encodeLetter(letter) : '',
                 (temp === null || temp === undefined) ? '' : String(temp),
                 (shape === null || shape === undefined) ? '' : String(shape)];
    while (parts.length > 1 && parts[parts.length - 1] === '') parts.pop();
    return parts.join('.');
  }

  function render() {
    var forced = forcedFamily();
    var forcedT = forcedTemperament();
    var forcedS = forcedShape();
    var letter = currentLetter();
    var rand = mulberry32(currentSeed);
    var family = drawAvatar(preview.getContext('2d'), PREVIEW_SIZE, rand,
                            forced, letter, currentSeed, forcedT, forcedS);
    location.hash = hashFor(currentSeed, forced, letter, forcedT, forcedS);
    var url = location.href;
    seedLink.innerHTML = 'Style: ' + FAMILY_NAMES[family] + ' &middot; ' +
      TEMPERAMENT_NAMES[temperamentFromSeed(currentSeed, forcedT)] + ' &middot; ' +
      SHAPE_NAMES[shapeFromSeed(currentSeed, forcedS)] +
      (letter ? ' + ' + letter.toUpperCase() : '') +
      ' &middot; Share this avatar: <a href="' + url + '">' + url + '</a>';
    recordHistory();
  }

  function clampSize() {
    var n = parseInt(sizeInput.value, 10);
    if (isNaN(n)) n = PREVIEW_SIZE;
    n = Math.max(MIN_SIZE, Math.min(MAX_SIZE, n));
    sizeInput.value = String(n);
    return n;
  }

  // --- History: remember recently generated avatars (persisted in
  // localStorage as hash strings; thumbnails are re-drawn from the seed).
  var HISTORY_KEY = 'avatarHistoryV1';
  var MAX_HISTORY = 60;
  var THUMB_DRAW = 96;
  var historyList = loadHistory();
  var historyRendered = [];

  function loadHistory() {
    var arr = [];
    try {
      arr = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    } catch (e) { return []; }
    if (Object.prototype.toString.call(arr) !== '[object Array]') return [];
    return arr.filter(function (h) {
      return typeof h === 'string' && parseHashStr(h) !== null;
    });
  }

  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(historyList)); }
    catch (e) { /* storage unavailable: keep the in-memory list only */ }
  }

  function recordHistory() {
    var h = (location.hash || '').replace(/^#/, '');
    if (h && historyList.indexOf(h) === -1) {
      historyList.unshift(h);
      if (historyList.length > MAX_HISTORY) historyList.length = MAX_HISTORY;
      saveHistory();
      renderHistory();
    } else {
      highlightHistory();
    }
  }

  function makeThumb(h) {
    var p = parseHashStr(h);
    var c = document.createElement('canvas');
    c.width = THUMB_DRAW;
    c.height = THUMB_DRAW;
    c.title = '#' + h;
    drawAvatar(c.getContext('2d'), THUMB_DRAW, mulberry32(p.seed),
               p.family, p.letter, p.seed, p.temp, p.shape);
    c.addEventListener('click', function () { location.hash = h; });
    return c;
  }

  function renderHistory() {
    while (historyGrid.firstChild) historyGrid.removeChild(historyGrid.firstChild);
    historyRendered = historyList.filter(function (h) {
      return parseHashStr(h) !== null;
    });
    for (var i = 0; i < historyRendered.length; i++) {
      historyGrid.appendChild(makeThumb(historyRendered[i]));
    }
    historyEmpty.style.display = historyRendered.length ? 'none' : 'block';
    highlightHistory();
  }

  function highlightHistory() {
    var cur = (location.hash || '').replace(/^#/, '');
    var kids = historyGrid.children || [];
    for (var i = 0; i < kids.length; i++) {
      kids[i].className = (i < historyRendered.length &&
                           historyRendered[i] === cur) ? 'thumb active' : 'thumb';
    }
  }

  // --- Actions ---
  familySelect.addEventListener('change', render);
  tempSelect.addEventListener('change', render);
  shapeSelect.addEventListener('change', render);

  letterInput.addEventListener('input', function () {
    render();
  });

  regenBtn.addEventListener('click', function () {
    currentSeed = randomSeed();
    render();
  });

  downloadBtn.addEventListener('click', function () {
    var size = clampSize();
    var canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    drawAvatar(canvas.getContext('2d'), size, mulberry32(currentSeed),
               forcedFamily(), currentLetter(), currentSeed, forcedTemperament(),
               forcedShape());
    canvas.toBlob(function (blob) {
      if (!blob) return;
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      // hashFor() output is filename-safe: hex/family/temp/shape parts are
      // plain, and any odd letter character is percent-encoded (no "/" or "?").
      a.download = 'avatar-' + size + 'x' + size + '-' +
                   hashFor(currentSeed, forcedFamily(), currentLetter(),
                           forcedTemperament(), forcedShape()) + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }, 'image/png');
  });

  clearHistoryBtn.addEventListener('click', function () {
    historyList = [];
    saveHistory();
    renderHistory();
  });

  window.addEventListener('hashchange', function () {
    var p = seedFromHash();
    if (!p) return;
    var famName = p.family === null ? 'random' : FAMILY_NAMES[p.family];
    var tempName = p.temp === null ? 'random' : TEMPERAMENT_NAMES[p.temp];
    var shapeName = p.shape === null ? 'random' : SHAPE_NAMES[p.shape];
    if (p.seed === currentSeed && familySelect.value === famName &&
        tempSelect.value === tempName && shapeSelect.value === shapeName &&
        p.letter.toUpperCase() === currentLetter().toUpperCase()) return;
    currentSeed = p.seed;
    familySelect.value = famName;
    tempSelect.value = tempName;
    shapeSelect.value = shapeName;
    letterInput.value = p.letter.toUpperCase();
    render();
  });

  render();
})();
</script>
</body>
</html>
