<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Avatar Icon Generator</title>
<style>
  :root {
    --bg: #1e1e2e;
    --fg: #e6e6e6;
    --accent: #7c6ff0;
    --panel: #2a2a3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 1rem;
  }
  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    margin: 0;
  }
  #preview {
    width: 256px;
    height: 256px;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
    display: block;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    background: var(--panel);
    padding: 0.75rem 1rem;
    border-radius: 12px;
  }
  .controls label {
    font-size: 0.9rem;
  }
  input[type="number"] {
    width: 5.5rem;
    padding: 0.4rem 0.5rem;
    border-radius: 8px;
    border: 1px solid #44445c;
    background: var(--bg);
    color: var(--fg);
    font-size: 0.95rem;
  }
  button {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  #seedLink {
    font-size: 0.8rem;
    color: #9a9ab5;
    max-width: 32rem;
    text-align: center;
    word-break: break-all;
    margin: 0;
  }
  #seedLink a { color: var(--accent); }
</style>
</head>
<body>
  <h1>Random Avatar Icon</h1>
  <canvas id="preview" width="256" height="256" aria-label="Random gradient avatar preview"></canvas>
  <div class="controls">
    <label for="sizeInput">Download size (px):</label>
    <input type="number" id="sizeInput" min="16" max="1024" step="1" value="256">
    <button id="regenBtn" type="button">Regenerate</button>
    <button id="downloadBtn" type="button">Download PNG</button>
  </div>
  <p id="seedLink"></p>

<script>
(function () {
  'use strict';

  var PREVIEW_SIZE = 256;
  var MIN_SIZE = 16;
  var MAX_SIZE = 1024;

  var preview = document.getElementById('preview');
  var sizeInput = document.getElementById('sizeInput');
  var regenBtn = document.getElementById('regenBtn');
  var downloadBtn = document.getElementById('downloadBtn');
  var seedLink = document.getElementById('seedLink');

  // --- Seeded RNG (mulberry32) so avatars are reproducible via URL hash ---
  function mulberry32(seed) {
    return function () {
      seed |= 0;
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function randomSeed() {
    var buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    return buf[0];
  }

  function seedFromHash() {
    var h = (location.hash || '').replace(/^#/, '');
    if (!/^[0-9a-f]{1,8}$/i.test(h)) return null;
    return parseInt(h, 16) >>> 0;
  }

  // --- Drawing ---
  function drawAvatar(ctx, size, rand) {
    // Two random anchor points on the square (linear gradient anchors).
    var x1 = rand() * size, y1 = rand() * size;
    var x2 = rand() * size, y2 = rand() * size;

    // Push the two anchors apart so gradients are rarely a flat blur.
    if (Math.abs(x2 - x1) + Math.abs(y2 - y1) < size * 0.4) {
      x2 = (x1 + size * 0.5) % size;
      y2 = (y1 + size * 0.5) % size;
    }

    // Random hues, pinned saturation/lightness bands for distinct, pleasant colors.
    function makeColor() {
      var hue = Math.floor(rand() * 360);
      var sat = 60 + rand() * 30;   // 60-90%
      var lig = 40 + rand() * 30;   // 40-70%
      return 'hsl(' + hue + ', ' + sat.toFixed(1) + '%, ' + lig.toFixed(1) + '%)';
    }

    var grad = ctx.createLinearGradient(x1, y1, x2, y2);
    grad.addColorStop(0, makeColor());
    grad.addColorStop(1, makeColor());
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
  }

  // --- State ---
  var currentSeed = seedFromHash();
  if (currentSeed === null) currentSeed = randomSeed();

  function render() {
    var rand = mulberry32(currentSeed);
    drawAvatar(preview.getContext('2d'), PREVIEW_SIZE, rand);
    location.hash = (currentSeed >>> 0).toString(16);
    var url = location.href;
    seedLink.innerHTML = 'Share this avatar: <a href="' + url + '">' + url + '</a>';
  }

  function clampSize() {
    var n = parseInt(sizeInput.value, 10);
    if (isNaN(n)) n = PREVIEW_SIZE;
    n = Math.max(MIN_SIZE, Math.min(MAX_SIZE, n));
    sizeInput.value = String(n);
    return n;
  }

  // --- Actions ---
  regenBtn.addEventListener('click', function () {
    currentSeed = randomSeed();
    render();
  });

  downloadBtn.addEventListener('click', function () {
    var size = clampSize();
    var canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    drawAvatar(canvas.getContext('2d'), size, mulberry32(currentSeed));
    canvas.toBlob(function (blob) {
      if (!blob) return;
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'avatar-' + size + 'x' + size + '-' +
                   (currentSeed >>> 0).toString(16) + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }, 'image/png');
  });

  window.addEventListener('hashchange', function () {
    var s = seedFromHash();
    if (s !== null && s !== currentSeed) {
      currentSeed = s;
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
